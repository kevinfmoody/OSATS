services:
  osats:
    build: .
    ports:
      - "4400:4400"
      - "4401:4401"
    command: ["--port", "4400", "--http-port", "4401", "--verbose"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4401/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
